sync-interval: 30s

snapshot:
  interval: 24h
  retention: 720h

dbs:
  - path: /home/boxd/portfolio-data/portfolio.db
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: ${R2_LITESTREAM_PATH}
      endpoint: ${R2_ENDPOINT_URL}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
